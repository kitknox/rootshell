			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "#!/bin/bash\n# Strip joe text editor from Release (distribution) builds.\n# Joe is GPL-licensed and only available in Debug builds.\n\nset -e\n\nif [ \"$CONFIGURATION\" = \"DebugAppStore\" ] || [ \"$CONFIGURATION\" = \"DebugStandalone\" ]; then\n    echo \"Debug build - keeping joe\"\n    exit 0\nfi\n\necho \"Release build - weak-linking and stripping joe\"\n\n# SwiftPM binary products ignore Xcode's optional-link flag. Convert joe's\n# load command before removing it so distribution builds still launch.\nJOE_EXECUTABLE=\"${TARGET_BUILD_DIR}/${EXECUTABLE_PATH}\"\nJOE_EXECUTABLE_DIR=\"$(dirname \"$JOE_EXECUTABLE\")\"\n/usr/bin/python3 \"${SRCROOT}/scripts/weak-link-joe.py\" \\\n    \"$JOE_EXECUTABLE\" \\\n    \"${JOE_EXECUTABLE_DIR}/${PRODUCT_NAME}.debug.dylib\"\n\n# Remove joe.framework from embedded frameworks\nJOE_FRAMEWORK=\"${BUILT_PRODUCTS_DIR}/${FRAMEWORKS_FOLDER_PATH}/joe.framework\"\nif [ -d \"$JOE_FRAMEWORK\" ]; then\n    rm -rf \"$JOE_FRAMEWORK\"\n    echo \"Removed joe.framework\"\nfi\n\n# Remove joe resource folder from app bundle\nJOE_RESOURCES=\"${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/joe\"\nif [ -d \"$JOE_RESOURCES\" ]; then\n    rm -rf \"$JOE_RESOURCES\"\n    echo \"Removed joe resources\"\nfi\n";
		};
